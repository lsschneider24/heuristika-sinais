services:
  - type: web
    name: heuristika-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: RUN_WORKER_ON_IMPORT=1 gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENABLE_SIMULATION_FALLBACK
        value: "true"
